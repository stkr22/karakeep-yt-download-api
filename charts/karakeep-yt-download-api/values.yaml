app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/stkr22/karakeep-yt-download-api
            tag: 0.2.0
          env:
            KYT_LIBRARY_PATH: /library
            KYT_JELLYFIN_URL: https://jellyfin.example.lan
            KYT_JELLYFIN_LIBRARY_ID: ''
            KYT_YTDLP_FORMAT: bestvideo*+bestaudio/best
            KYT_YTDLP_MERGE_FORMAT: mkv
            KYT_CHANNEL_FOLDERS: 'true'
            KYT_WEBHOOK_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: karakeep-yt-download-api
                  key: webhook-token
            KYT_JELLYFIN_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: karakeep-yt-download-api
                  key: jellyfin-api-key
          probes:
            liveness: &ref_0
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8000
            readiness: *ref_0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
  service:
    main:
      controller: main
      ports:
        http:
          port: 8000
  persistence:
    library:
      type: nfs
      server: nfs.example.lan
      path: /export/media/youtube
      globalMounts:
        - path: /library
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
